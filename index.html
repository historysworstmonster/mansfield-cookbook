<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mansfield Cook Book Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --warm-bg: #fcf9f2;            /* Buttery cream background */
            --card-bg: #ffffff;            /* Clean white card surface */
            --primary-dark: #8c4225;       /* Warmer toasted spice / rust (less brown) */
            --primary-dark-hover: #73341b; 
            --accent-gold: #c99f36;        /* Warm amber gold */
            --accent-terracotta: #bd563b;  /* Vibrant cozier accent */
            --border-color: #e8dfd1;       /* Soft warm border */
            --text-main: #2b2621;          /* Deep espresso text */
            --text-muted: #6b6156;         /* Warm muted secondary text */
        }

        body { 
            font-family: 'Fredoka', sans-serif; 
            background: var(--warm-bg); 
            margin: 0; 
            color: var(--text-main); 
            line-height: 1.65; 
        }
        
        #countdown-container { 
            background: var(--primary-dark); 
            color: #f7f4ed; 
            padding: 14px; 
            text-align: center; 
            font-weight: 500; 
            font-size: 1rem;
            letter-spacing: 0.5px;
            border-bottom: 3px solid var(--accent-gold); 
        }
        
        header { 
            text-align: center; 
            padding: 100px 20px; 
            background-color: var(--primary-dark); 
            /* Lighter, neutral warm-charcoal overlay so club-logo.jpg shows through clearly */
            background-image: linear-gradient(rgba(43, 38, 33, 0.45), rgba(43, 38, 33, 0.45)), url('club-logo.jpg'); 
            background-size: cover; 
            background-position: center; 
            color: #f7f4ed; 
            box-shadow: inset 0 -20px 40px rgba(0,0,0,0.25);
        }
        header h1 { 
            margin: 0; 
            font-size: 3.2rem; 
            font-weight: 600; 
            letter-spacing: 0.5px; 
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.65); 
        }

        .container { max-width: 950px; margin: 40px auto; padding: 0 20px; }

        .card { 
            background: var(--card-bg); 
            padding: 35px; 
            margin-bottom: 35px; 
            border-radius: 14px; 
            border-left: 6px solid var(--accent-terracotta); 
            box-shadow: 0 8px 30px rgba(43, 38, 33, 0.05); 
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        h2 { 
            color: var(--primary-dark); 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 12px; 
            margin-top: 0; 
            font-size: 1.4rem;
            font-weight: 600;
        }

        .table-responsive { width: 100%; overflow-x: auto; }

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwxezI8eswlRSydlimQPE43OYft5auqv9KrJeK8K1G_rJlig0pCmAavwq8cmOPRZJIw/exec";
    let allRecipes = [];

    async function loadAll() {
        try {
            const rsvp = await (await fetch(WEB_APP_URL + "?sheet=RSVPs")).json();
            const rsvpBody = document.querySelector("#dishTable tbody");
            rsvpBody.innerHTML = "";
            
            rsvp.forEach(row => {
                const tr = rsvpBody.insertRow();
                let sourceContent = row[2] || "";
                
                // Format links beautifully
                if (sourceContent.startsWith('http') || sourceContent.startsWith('www')) {
                    const url = sourceContent.startsWith('www') ? `https://${sourceContent}` : sourceContent;
                    try {
                        const domain = new URL(url).hostname.replace('www.', '');
                        sourceContent = `<a href="${url}" target="_blank" style="color:var(--lib-navy); font-weight:bold; text-decoration:underline;">${domain}</a>`;
                    } catch(e) {
                        sourceContent = `<a href="${url}" target="_blank" style="color:var(--lib-navy); font-weight:bold; text-decoration:underline;">Link</a>`;
                    }
                }
                
                tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td><td>${sourceContent}</td>`;
            });

            const suggs = await (await fetch(WEB_APP_URL + "?sheet=Suggestions")).json();
            const suggDiv = document.getElementById("suggestionList");
            suggs.sort((a,b) => (b[1]||0) - (a[1]||0));
            suggDiv.innerHTML = "";
            suggs.forEach(row => {
                suggDiv.innerHTML += `<div class="suggestion-item"><span>${row[0]}</span><div><b style="color:var(--lib-gold); margin-right:10px;">${row[1]||0}</b> <button class="vote-btn" onclick="vote('${row[0]}')">↑ Vote</button></div></div>`;
            });

            allRecipes = await (await fetch(WEB_APP_URL + "?sheet=Archive")).json();
            renderRecipes(allRecipes);

            const recs = await (await fetch(WEB_APP_URL + "?sheet=Recommendations")).json();
            const recDiv = document.getElementById("recList");
            recDiv.innerHTML = "";
            recs.forEach(row => {
                let linkHTML = row[2] ? `<br><a href="${row[2]}" target="_blank" style="color:var(--lib-gold); font-size:0.9rem; text-decoration:none; font-weight:bold;">View Link →</a>` : "";
                recDiv.innerHTML += `<div style="padding:10px; border-bottom:1px solid #eee;"><b>${row[0]}:</b> ${row[1]} ${linkHTML}</div>`;
            });
        } catch (e) { 
            console.error("Error:", e); 
        }
    }

    function renderRecipes(data) {
        const grid = document.getElementById("recipeGrid");
        grid.innerHTML = "";
        data.forEach(row => {
            if(row[0]) {
                grid.innerHTML += `<div class="recipe-card"><div><h3>${row[0]}</h3><p>${row[1]||''}</p></div><a href="${row[2]}" target="_blank" class="btn">View PDF</a></div>`;
            }
        });
    }

    async function saveToSheet(sheet, ids) {
        const vals = ids.map(id => document.getElementById(id).value);
        if(sheet !== 'Recommendations' && vals.some(v => !v)) { alert("Please fill in all fields"); return; }
        await fetch(WEB_APP_URL + "?sheet=" + sheet, { method: "POST", mode: "no-cors", body: JSON.stringify(sheet === 'Suggestions' ? [vals[0], 0] : vals) });
        location.reload();
    }

    async function vote(id) {
        await fetch(`${WEB_APP_URL}?action=upvote&id=${encodeURIComponent(id)}&sheet=Suggestions`, { method: "POST", mode: "no-cors" });
        location.reload();
    }

    function filterRecipes() {
        const term = document.getElementById("recipeSearch").value.toLowerCase();
        const filtered = allRecipes.filter(r => (r[0] && r[0].toLowerCase().includes(term)) || (r[1] && r[1].toLowerCase().includes(term)));
        renderRecipes(filtered);
    }

    const nextMeeting = new Date("Jul 23, 2026 18:00:00").getTime();
    setInterval(() => {
        const now = new Date().getTime(), diff = nextMeeting - now;
        const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000);
        document.getElementById("timer").innerHTML = d + "d " + h + "h " + m + "m ";
    }, 1000);

    window.onload = loadAll;
</script>
